<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Porra Mundial 2026</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* Custom style overlay for full-center alignment on auth card */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .auth-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="brand">
        <span>🏆 Porra<span class="brand-accent">Mundial2026</span></span>
      </div>
    </div>
  </header>

  <div class="auth-container">
    <div class="card auth-card">
      <div class="auth-header">
        <h2 id="auth-title">Iniciar Sesión</h2>
        <p id="auth-desc">Accede para ver o modificar tus predicciones.</p>
      </div>

      <div id="error-message" style="display: none; background: rgba(244, 67, 54, 0.1); border: 1px solid var(--accent-red); color: #ff8a80; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: 600; font-size: 0.9rem;"></div>

      <form id="auth-form" onsubmit="handleAuth(event)">
        <div class="form-group">
          <label for="username" class="form-label">Nombre de Usuario</label>
          <input type="text" id="username" class="form-control" placeholder="Ej: Sergio, Juan..." required autocomplete="username">
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn" style="margin-top: 10px;">
          Ingresar
        </button>
      </form>

      <div class="auth-toggle" style="display: none;">
        <span id="toggle-text">¿No tienes cuenta?</span> 
        <a href="#" id="toggle-link" onclick="toggleMode(event)" style="font-weight: 700;">Regístrate aquí</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script>
    let isLoginMode = true;

    // Check if user is already logged in, redirect to predictions
    async function checkSession() {
      try {
        const res = await fetch('/api/auth/me');
        const data = await res.json();
        if (data.user) {
          window.location.href = '/predictions.html';
        }
      } catch (err) {
        console.error("Error verifying session", err);
      }
    }

    checkSession();

    function toggleMode(e) {
      e.preventDefault();
      isLoginMode = !isLoginMode;
      
      const title = document.getElementById('auth-title');
      const desc = document.getElementById('auth-desc');
      const btn = document.getElementById('submit-btn');
      const toggleLink = document.getElementById('toggle-link');
      const toggleText = document.getElementById('toggle-text');
      const errMsg = document.getElementById('error-message');
      
      errMsg.style.display = 'none';

      if (isLoginMode) {
        title.innerText = "Iniciar Sesión";
        desc.innerText = "Accede para ver o modificar tus predicciones.";
        btn.innerText = "Ingresar";
        toggleText.innerText = "¿No tienes cuenta?";
        toggleLink.innerText = "Regístrate aquí";
      } else {
        title.innerText = "Crear Cuenta";
        desc.innerText = "Regístrate para participar en la porra del Mundial.";
        btn.innerText = "Registrarse y Entrar";
        toggleText.innerText = "¿Ya tienes cuenta?";
        toggleLink.innerText = "Inicia sesión aquí";
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errMsg = document.getElementById('error-message');
      
      errMsg.style.display = 'none';

      const url = isLoginMode ? '/api/auth/login' : '/api/auth/register';
      
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        
        if (!res.ok) {
          errMsg.innerText = data.error || "Ocurrió un error inesperado.";
          errMsg.style.display = 'block';
          showToast(data.error || "Error en la autenticación", true);
        } else {
          showToast(data.message, false);
          setTimeout(() => {
            if (data.user.isAdmin) {
              window.location.href = '/admin.html';
            } else {
              window.location.href = '/predictions.html';
            }
          }, 1000);
        }
      } catch (err) {
        console.error(err);
        errMsg.innerText = "Error al conectar con el servidor.";
        errMsg.style.display = 'block';
        showToast("Error de conexión.", true);
      }
    }

    function showToast(message, isError = false) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${isError ? 'error' : 'success'}`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
</html>
